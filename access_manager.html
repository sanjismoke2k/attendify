<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Manager - Attendify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e0eafc; 
            overflow-x: hidden; 
        }
        h1, h2, h3 { 
            font-family: 'Poppins', sans-serif; 
        }
        
        /* --- Background Animation --- */
        .background-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e6dada, #f0e1e1); 
            background-size: 400% 400%; 
            animation: gradientBG 15s ease infinite; 
        }
        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }
        .shapes span { 
            position: absolute; bottom: -150px; background-color: rgba(255, 255, 255, 0.1); 
            border-radius: 50%; animation: floatUp 25s linear infinite; 
        }
        .shapes span:nth-child(1) { width: 80px; height: 80px; left: 25%; }
        .shapes span:nth-child(2) { width: 50px; height: 50px; left: 70%; }
        @keyframes floatUp { to { transform: translateY(-120vh) rotate(720deg); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }

        /* --- Glass Card Styles --- */
        .glass-card { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 20px 50px 0 rgba(31, 38, 135, 0.15); 
            transition: all 0.3s ease; 
        }
        
        .glass-table-container {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 1rem;
            /* CRITICAL FOR MOBILE SLIDING: */
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Custom Scrollbar for the table */
        .glass-table-container::-webkit-scrollbar { height: 6px; }
        .glass-table-container::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .glass-table-container::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
        .glass-table-container::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.2); }

        /* --- Buttons --- */
        .btn-hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.3); }
        
        .btn-approve { 
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white; 
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.3);
        }
        .btn-reject { 
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.3);
        }

        /* Table Row Hover Effect */
        tr.hover-row:hover { background-color: rgba(255, 255, 255, 0.6); }
        
        /* Prevent text wrapping to enforce sliding behavior */
        th, td { white-space: nowrap; }
    </style>
</head>
<body class="antialiased text-slate-800 min-h-screen p-4 sm:p-6 flex justify-center items-start pt-8 sm:pt-12">
    
    <!-- Background Elements -->
    <div class="background-container"><div class="shapes"><span></span><span></span></div></div>

    <div class="w-full max-w-5xl fade-in">
        <div class="glass-card rounded-[1.5rem] sm:rounded-[2rem] p-6 sm:p-10">
            
            <!-- Header -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 pb-6 border-b border-slate-200/50">
                <div class="flex items-center gap-4 mb-4 md:mb-0 w-full md:w-auto">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 bg-gradient-to-br from-purple-100 to-white rounded-2xl flex items-center justify-center shadow-md text-purple-600 flex-shrink-0">
                        <i data-lucide="shield-check" class="w-6 h-6 sm:w-8 sm:h-8"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold text-slate-800">Access Manager</h1>
                        <p class="text-slate-500 text-xs sm:text-sm font-medium">Review registration requests</p>
                    </div>
                </div>
                <a href="/login" class="w-full md:w-auto justify-center px-5 py-2.5 rounded-xl bg-white/70 hover:bg-white text-slate-600 hover:text-red-500 font-bold text-sm shadow-sm border border-white/50 transition-all btn-hover-lift flex items-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </a>
            </div>

            <!-- Content Grid -->
            <div class="grid gap-4 sm:gap-6">
                
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-2 px-1 gap-2">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        Pending Approvals
                    </h2>
                    <span id="count-badge" class="bg-yellow-100/80 backdrop-blur-sm text-yellow-800 text-xs font-bold px-3 py-1 rounded-full border border-yellow-200/50 shadow-sm">
                        Loading...
                    </span>
                </div>

                <!-- ADDED: Hint for mobile users -->
                <div class="sm:hidden text-xs text-slate-400 italic mb-1 flex items-center gap-1">
                    <i data-lucide="move-horizontal" class="w-3 h-3"></i>
                </div>

                <div class="glass-table-container shadow-inner">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead class="text-xs text-slate-500 uppercase bg-white/50 border-b border-slate-200/50">
                            <tr>
                                <th class="px-4 sm:px-6 py-4 font-bold tracking-wider">User Profile</th>
                                <th class="px-4 sm:px-6 py-4 font-bold tracking-wider">Role</th>
                                <th class="px-4 sm:px-6 py-4 font-bold tracking-wider">Requested</th>
                                <th class="px-4 sm:px-6 py-4 font-bold tracking-wider text-right">Decision</th>
                            </tr>
                        </thead>
                        <tbody id="request-list" class="divide-y divide-slate-200/50">
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center text-slate-400 italic">
                                    <div class="flex flex-col items-center gap-2">
                                        <div class="w-6 h-6 border-2 border-slate-300 border-t-purple-500 rounded-full animate-spin"></div>
                                        <span>Fetching data...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function loadRequests() {
            try {
                const res = await fetch('/api/super_admin/requests');
                if (res.status === 401) window.location.href = '/login';
                
                const requests = await res.json();
                const tbody = document.getElementById('request-list');
                const badge = document.getElementById('count-badge');
                
                badge.innerText = `${requests.length} Pending`;
                badge.className = requests.length > 0 
                    ? "bg-yellow-100/80 backdrop-blur-sm text-yellow-800 text-xs font-bold px-3 py-1 rounded-full border border-yellow-200/50 shadow-sm"
                    : "bg-green-100/80 backdrop-blur-sm text-green-800 text-xs font-bold px-3 py-1 rounded-full border border-green-200/50 shadow-sm";

                tbody.innerHTML = '';

                if (requests.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="px-6 py-16 text-center text-slate-400">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center">
                                        <i data-lucide="check" class="w-6 h-6 text-slate-300"></i>
                                    </div>
                                    <p class="font-medium">All caught up! No pending requests.</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    lucide.createIcons();
                    return;
                }

                requests.forEach(user => {
                    const row = document.createElement('tr');
                    row.className = 'hover-row transition-colors duration-200';
                    row.innerHTML = `
                        <td class="px-4 sm:px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br ${user.role === 'student' ? 'from-blue-100 to-white' : 'from-purple-100 to-white'} flex items-center justify-center text-slate-600 font-bold border border-white shadow-sm flex-shrink-0">
                                    ${user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div class="font-bold text-slate-800 text-sm sm:text-base">${user.name}</div>
                                    <div class="text-xs text-slate-500 font-mono bg-white/50 px-1.5 py-0.5 rounded inline-block border border-white/60">ID: ${user.id}</div>
                                    ${user.dept ? `<span class="text-xs text-slate-400 ml-1">• ${user.dept}</span>` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="px-4 sm:px-6 py-4">
                            <span class="${user.role === 'student' ? 'bg-blue-50 text-blue-700 border-blue-100' : 'bg-purple-50 text-purple-700 border-purple-100'} text-xs font-bold px-2.5 py-1 rounded-lg border shadow-sm">
                                ${user.role.toUpperCase()}
                            </span>
                        </td>
                        <td class="px-4 sm:px-6 py-4 text-slate-500 text-sm font-medium">
                            ${user.registered_at || 'Just now'}
                        </td>
                        <td class="px-4 sm:px-6 py-4 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="handleAction('${user.id}', '${user.role}', 'approve')" class="btn-approve btn-hover-lift px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
                                    <i data-lucide="check" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Approve</span>
                                </button>
                                <button onclick="handleAction('${user.id}', '${user.role}', 'reject')" class="btn-reject btn-hover-lift px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
                                    <i data-lucide="x" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Reject</span>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                lucide.createIcons();

            } catch (err) {
                console.error(err);
            }
        }

        async function handleAction(id, role, action) {
            if(!confirm(`Are you sure you want to ${action} ${role} ${id}?`)) return;
            
            try {
                const res = await fetch('/api/super_admin/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, role, action })
                });
                
                if (res.ok) {
                    loadRequests(); 
                } else {
                    alert("Action failed.");
                }
            } catch (err) {
                console.error(err);
                alert("Server error.");
            }
        }

        loadRequests();
    </script>
</body>
</html>
