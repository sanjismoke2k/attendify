<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendify Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e0eafc;
            overflow-x: hidden;
        }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        
        /* --- Background Animation --- */
        .background-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e6dada, #f0e1e1); 
            background-size: 400% 400%; 
            animation: gradientBG 15s ease infinite; 
        }
        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }
        .shapes span { 
            position: absolute; bottom: -150px; background-color: rgba(255, 255, 255, 0.1); 
            border-radius: 50%; animation: floatUp 25s linear infinite; 
        }
        .shapes span:nth-child(1) { width: 80px; height: 80px; left: 25%; }
        .shapes span:nth-child(2) { width: 50px; height: 50px; left: 70%; }
        @keyframes floatUp { to { transform: translateY(-120vh) rotate(720deg); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        
        /* --- Glass Cards --- */
        .glass-card, .glass-menu {
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 20px 50px 0 rgba(31, 38, 135, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* --- Animated Logo Styles --- */
        :root { --logo-primary-color: #007aff; --logo-animation-speed: 3.5s; }
        .logo-container { width: 80px; height: 80px; position: relative; display: flex; justify-content: center; align-items: center; margin: auto; margin-bottom: 1.5rem; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); }
        .face-icon { width: 50px; height: 50px; position: relative; color: var(--logo-primary-color); }
        .eye { width: 6px; height: 6px; background-color: var(--logo-primary-color); border-radius: 50%; position: absolute; top: 14px; }
        .eye.left { left: 12px; } .eye.right { right: 12px; }
        .smile { width: 20px; height: 10px; border: 3px solid transparent; border-bottom: 3px solid var(--logo-primary-color); border-radius: 0 0 20px 20px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); animation: smile-animate var(--logo-animation-speed) ease-in-out infinite alternate; animation-delay: 0.25s; }
        .corner { width: 14px; height: 14px; position: absolute; border-style: solid; border-color: var(--logo-primary-color); border-width: 4px; animation: pop-in-out var(--logo-animation-speed) ease-in-out infinite alternate; }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; animation-delay: 0.5s; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 10px; animation-delay: 0.5s; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 10px 0; }
        .scan-bar { position: absolute; left: 0; top: 0; width: 100%; height: 2px; background: linear-gradient(to right, transparent 0%, rgba(0, 122, 255, 0.1) 20%, rgba(0, 122, 255, 0.9) 50%, rgba(0, 122, 255, 0.1) 80%, transparent 100%); opacity: 0; animation: professional-scan var(--logo-animation-speed) ease-in-out infinite alternate; }
        @keyframes smile-animate { from { transform: translateX(-50%) scaleX(1); } to { transform: translateX(-50%) scaleX(0.75); } }
        @keyframes pop-in-out { from { transform: scale(1); } to { transform: scale(0.92); } }
        @keyframes professional-scan { 0% { transform: translateY(8px); opacity: 0; } 10% { transform: translateY(8px); opacity: 1; } 90% { transform: translateY(40px); opacity: 1; } 100% { transform: translateY(40px); opacity: 0; } }
    </style>
</head>
<body class="antialiased text-slate-800">
    <div class="background-container"><div class="shapes"><span></span><span></span></div></div>

    <!-- Dropdown Menu -->
    <div class="absolute top-5 right-5 z-50">
        <button id="menuButton" class="glass-menu p-3 rounded-full focus:outline-none focus:ring-2 focus:ring-white/50 hover:bg-white/30 transition-colors">
            <i data-lucide="more-vertical" class="w-6 h-6 text-slate-700"></i>
        </button>
        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-64 glass-menu rounded-2xl shadow-xl py-2">
            <div class="px-4 py-3 border-b border-slate-200/50">
                <p class="text-sm font-bold text-slate-800">Menu</p>
            </div>
            <a href="/" class="flex items-center px-4 py-3 text-slate-700 hover:bg-white/40 transition-colors">
                <i data-lucide="home" class="w-5 h-5 mr-3 text-sky-600"></i>
                <span class="font-medium">Home</span>
            </a>
            <a href="/dashboard" class="flex items-center px-4 py-3 text-slate-700 hover:bg-white/40 transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3 text-violet-600"></i>
                 <span class="font-medium">Dashboard</span>
            </a>
            <a href="/admin" class="flex items-center px-4 py-3 text-slate-700 hover:bg-white/40 transition-colors">
                <i data-lucide="sliders-horizontal" class="w-5 h-5 mr-3 text-orange-600"></i>
                <span class="font-medium">Admin Settings</span>
            </a>
            <a href="/access_manager" class="flex items-center px-4 py-3 text-slate-700 hover:bg-white/40 transition-colors">
                <i data-lucide="shield-check" class="w-5 h-5 mr-3 text-green-600"></i>
                <span class="font-medium">Access Requests</span>
            </a>
        </div>
    </div>

    <div class="relative flex flex-col items-center justify-center min-h-screen p-4 fade-in">
        <div class="text-center mb-6 md:mb-12 mt-12 md:mt-0">
            <div class="logo-container transform hover:scale-105 transition-transform duration-500">
                <div class="face-icon">
                    <div class="corner top-left"></div><div class="corner top-right"></div>
                    <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
                    <div class="eye left"></div><div class="eye right"></div>
                    <div class="smile"></div><div class="scan-bar"></div>
                </div>
            </div>
            
            <h1 class="text-3xl md:text-5xl font-bold text-slate-800 tracking-tight">Attendify</h1>
            <p class="text-slate-600 mt-2 text-base md:text-lg font-medium">Intelligent Face Recognition Attendance</p>
        </div>
        
        <!-- Grid adjusted to 3 columns -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto w-full px-4">
            
            <!-- Enroll Student Card -->
            <a href="/enroll" class="glass-card rounded-[2rem] p-8 text-center flex flex-col items-center justify-center group">
                <div class="w-16 h-16 bg-blue-50/80 rounded-2xl flex items-center justify-center shadow-sm text-blue-600 mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="user-plus" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1">Enroll</h3>
                <p class="text-slate-500 text-sm">Register new faces</p>
            </a>
            
            <!-- Start Attendance Card -->
            <a href="/start_attendance" class="glass-card rounded-[2rem] p-8 text-center flex flex-col items-center justify-center group">
                <div class="w-16 h-16 bg-green-50/80 rounded-2xl flex items-center justify-center shadow-sm text-green-600 mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="camera" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1">Attendance</h3>
                <p class="text-slate-500 text-sm">Start recognition</p>
            </a>
            
            <!-- Dashboard Card -->
            <a href="/dashboard" class="glass-card rounded-[2rem] p-8 text-center flex flex-col items-center justify-center group">
                <div class="w-16 h-16 bg-violet-50/80 rounded-2xl flex items-center justify-center shadow-sm text-violet-600 mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="layout-dashboard" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1">Reports</h3>
                <p class="text-slate-500 text-sm">View records</p>
            </a>

        </div>
    </div>

    <script>
        lucide.createIcons();

        const menuButton = document.getElementById('menuButton');
        const dropdownMenu = document.getElementById('dropdownMenu');

        menuButton.addEventListener('click', (event) => {
            event.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
        });

        window.addEventListener('click', (event) => {
            if (!dropdownMenu.classList.contains('hidden') && !menuButton.contains(event.target)) {
                dropdownMenu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
