<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e0eafc;
        }
        .background-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e6dada, #f0e1e1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(150%);
            padding: 1rem 1.5rem; border-radius: 0.5rem;
            font-weight: 500; color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.4s ease-in-out; z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background-color: #28a745; }
        .toast.error { background-color: #dc3545; }
    </style>
</head>
<body class="antialiased">
    <div class="background-container"></div>
    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-4xl fade-in">
        
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 text-center sm:text-left">Admin Control Panel</h1>
            <div class="flex items-center gap-3">
                <a href="/" class="bg-white/50 backdrop-blur-xl text-slate-700 font-semibold py-2 px-4 rounded-lg flex items-center gap-2 border border-white/30 hover:bg-white/80 transition-all shadow-sm">
                    <i data-lucide="home" class="w-5 h-5"></i> Home
                </a>
                <a href="/admin_logout" class="bg-red-500/80 backdrop-blur-xl text-white font-semibold py-2 px-4 rounded-lg flex items-center gap-2 border border-white/30 hover:bg-red-600/80 transition-all shadow-sm">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </a>
            </div>
        </header>

        <div class="glass-card rounded-3xl p-6 sm:p-8 space-y-6">
            <div id="settingsForm" class="space-y-6">
                <!-- Recognition Framework -->
                <div>
                    <label for="recognitionFramework" class="block text-sm font-medium text-slate-700 mb-2">Recognition Framework</label>
                    <select id="recognitionFramework" name="RECOGNITION_FRAMEWORK" class="w-full p-3 bg-white/50 rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-sky-400">
                        <option value="DeepFace">DeepFace (Higher Accuracy)</option>
                        <option value="OpenCV">OpenCV LBPH (Faster, Lightweight)</option>
                    </select>
                </div>

                <!-- DeepFace Specific Settings -->
                <div id="deepfaceSettings" class="space-y-6 border-t border-white/50 pt-6">
                    <div>
                        <label for="deepfaceModel" class="block text-sm font-medium text-slate-700 mb-2">DeepFace Model</label>
                        <select id="deepfaceModel" name="DEEPFACE_MODEL" class="w-full p-3 bg-white/50 rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-sky-400">
                            <option>VGG-Face</option><option>Facenet</option><option>Facenet512</option><option>OpenFace</option><option>DeepFace</option><option>DeepID</option><option>ArcFace</option><option>Dlib</option><option>SFace</option>
                        </select>
                    </div>
                    <div>
                        <label for="deepfaceThreshold" class="block text-sm font-medium text-slate-700 mb-1">DeepFace Distance Threshold (lower is stricter)</label>
                        <p class="text-xs text-slate-500 mb-2">Recommended for ArcFace/VGG-Face: 0.4 - 1.0</p>
                        <input type="number" step="0.01" id="deepfaceThreshold" name="DEEPFACE_DISTANCE_THRESHOLD" class="w-full p-3 bg-white/50 rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-sky-400">
                    </div>
                </div>
                
                <!-- OpenCV Specific Settings -->
                <div id="opencvSettings" class="space-y-6 border-t border-white/50 pt-6" style="display: none;">
                     <div>
                        <label for="opencvThreshold" class="block text-sm font-medium text-slate-700 mb-1">OpenCV Confidence Threshold (lower is stricter)</label>
                        <p class="text-xs text-slate-500 mb-2">Recommended range: 30 - 100. Start around 70.</p>
                        <input type="number" id="opencvThreshold" name="OPENCV_CONF_THRESHOLD" class="w-full p-3 bg-white/50 rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-sky-400">
                    </div>
                    <div>
                        <button id="trainOpenCVButton" class="w-full bg-amber-500/80 text-white font-bold py-3 px-6 rounded-lg border border-white/30 hover:bg-amber-600/80 transition-all flex items-center justify-center gap-2">
                           <i data-lucide="refresh-cw" class="w-5 h-5"></i> Train OpenCV Model Manually
                        </button>
                    </div>
                </div>

                <!-- General Settings -->
                <div class="border-t border-white/50 pt-6 space-y-6">
                    <div>
                        <label for="cameraSource" class="block text-sm font-medium text-slate-700 mb-2">Camera Source</label>
                        <select id="cameraSource" name="CAMERA_SOURCE" class="w-full p-3 bg-white/50 rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-sky-400">
                            <option value="local_server">Use Laptop/Server's Camera</option>
                            <option value="remote_phone">Use Phone's Camera (Remote)</option>
                        </select>
                         <!-- [NEW] Button to launch the remote camera page -->
                        <div id="remoteCameraLinkContainer" class="mt-4" style="display: none;">
                             <a href="/remote_camera" target="_blank" class="w-full bg-indigo-500/80 text-white font-bold py-3 px-6 rounded-lg border border-white/30 hover:bg-indigo-600/80 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="smartphone" class="w-5 h-5"></i> Launch Remote Camera Page
                            </a>
                        </div>
                    </div>
                    <div>
                        <label for="minPresence" class="block text-sm font-medium text-slate-700 mb-2">Minimum Presence for Attendance (Minutes)</label>
                        <input type="number" step="0.1" id="minPresence" name="MIN_PRESENCE_MINUTES" class="w-full p-3 bg-white/50 rounded-lg border border-white/30 focus:outline-none focus:ring-2 focus:ring-sky-400">
                    </div>
                </div>
            </div>

            <div class="pt-6 border-t border-white/50">
                <button id="saveButton" class="w-full bg-sky-500/80 text-white font-bold py-3 px-6 rounded-lg border border-white/30 hover:bg-sky-600/80 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> Save Settings
                </button>
            </div>
        </div>
    </div>
    
    <div id="toastContainer"></div>

<script>
    const frameworkSelect = document.getElementById('recognitionFramework');
    const cameraSourceSelect = document.getElementById('cameraSource');
    const remoteCameraLinkContainer = document.getElementById('remoteCameraLinkContainer');
    const deepfaceSettings = document.getElementById('deepfaceSettings');
    const opencvSettings = document.getElementById('opencvSettings');
    const saveButton = document.getElementById('saveButton');
    const trainButton = document.getElementById('trainOpenCVButton');

    function toggleFrameworkSettingsView() {
        deepfaceSettings.style.display = frameworkSelect.value === 'DeepFace' ? 'block' : 'none';
        opencvSettings.style.display = frameworkSelect.value === 'OpenCV' ? 'block' : 'none';
    }

    function toggleRemoteCameraLink() {
        remoteCameraLinkContainer.style.display = cameraSourceSelect.value === 'remote_phone' ? 'block' : 'none';
    }

    async function loadSettings() {
        try {
            const response = await fetch('/api/settings');
            const data = await response.json();
            if (data.success) {
                const settings = data.settings;
                document.getElementById('recognitionFramework').value = settings.RECOGNITION_FRAMEWORK || 'DeepFace';
                document.getElementById('cameraSource').value = settings.CAMERA_SOURCE || 'local_server';
                document.getElementById('deepfaceModel').value = settings.DEEPFACE_MODEL || 'ArcFace';
                document.getElementById('deepfaceThreshold').value = settings.DEEPFACE_DISTANCE_THRESHOLD || 0.68;
                document.getElementById('opencvThreshold').value = settings.OPENCV_CONF_THRESHOLD || 70;
                document.getElementById('minPresence').value = settings.MIN_PRESENCE_MINUTES || 0.1;
                toggleFrameworkSettingsView();
                toggleRemoteCameraLink();
            } else { showToast('Failed to load settings.', 'error'); }
        } catch (error) { showToast('Error connecting to server.', 'error'); }
    }

    async function saveSettings() {
        const settings = {
            RECOGNITION_FRAMEWORK: document.getElementById('recognitionFramework').value,
            CAMERA_SOURCE: document.getElementById('cameraSource').value,
            DEEPFACE_MODEL: document.getElementById('deepfaceModel').value,
            DEEPFACE_DISTANCE_THRESHOLD: parseFloat(document.getElementById('deepfaceThreshold').value),
            OPENCV_CONF_THRESHOLD: parseInt(document.getElementById('opencvThreshold').value, 10),
            MIN_PRESENCE_MINUTES: parseFloat(document.getElementById('minPresence').value)
        };
        try {
            saveButton.disabled = true; saveButton.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Saving...`; lucide.createIcons();
            const response = await fetch('/api/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(settings)
            });
            const data = await response.json();
            showToast(data.message || 'Settings saved!', data.success ? 'success' : 'error');
        } catch (error) {
            showToast('Error connecting to server.', 'error');
        } finally {
            saveButton.disabled = false; saveButton.innerHTML = `<i data-lucide="save" class="w-5 h-5"></i> Save Settings`; lucide.createIcons();
        }
    }

    async function trainOpenCVModel() {
         try {
            trainButton.disabled = true; trainButton.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Training...`; lucide.createIcons();
            const response = await fetch('/api/train_opencv', { method: 'POST' });
            const data = await response.json();
            showToast(data.message || 'Training started!', data.success ? 'success' : 'error');
        } catch (error) {
            showToast('Error connecting to server.', 'error');
        } finally {
            trainButton.disabled = false; trainButton.innerHTML = `<i data-lucide="refresh-cw" class="w-5 h-5"></i> Train OpenCV Model Manually`; lucide.createIcons();
        }
    }

    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        document.getElementById('toastContainer').appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    frameworkSelect.addEventListener('change', toggleFrameworkSettingsView);
    cameraSourceSelect.addEventListener('change', toggleRemoteCameraLink);
    saveButton.addEventListener('click', saveSettings);
    trainButton.addEventListener('click', trainOpenCVModel);
    
    lucide.createIcons();
    loadSettings();
</script>
</body>
</html>
