<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Attendify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e0eafc;
        }
        h1 {
            font-family: 'Poppins', sans-serif;
        }
        .background-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e6dada, #f0e1e1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .input-glass {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body class="antialiased text-slate-800">
    <div class="background-container"></div>

    <div class="relative flex flex-col items-center justify-center min-h-screen p-4 fade-in">
        
        <div class="absolute top-5 left-5">
            <a href="/" class="glass-card text-slate-700 font-semibold py-2 px-4 rounded-xl hover:bg-white/30 transition-colors flex items-center gap-2">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span>Home</span>
            </a>
        </div>

        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-slate-800">Admin Access</h1>
                <p class="text-slate-600 mt-2">Please enter the password to continue.</p>
            </div>

            <div class="glass-card rounded-3xl p-8">
                <form method="POST" action="/admin_login">
                    <div>
                        <label for="password" class="block text-md font-medium text-slate-700 sr-only">Password</label>
                        <input type="password" id="password" name="password" required
                               class="input-glass w-full p-3 rounded-lg text-slate-800 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition"
                               placeholder="Enter password...">
                    </div>
                    
                    <div id="errorMessage" class="text-red-600 text-center font-semibold mt-4"></div>

                    <div class="mt-6">
                        <button type="submit"
                                class="w-full bg-sky-600 text-white font-bold py-3 px-6 rounded-full hover:bg-sky-700 transition-all text-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 focus:ring-offset-white/20">
                            Login
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Check for login error from URL parameter and display message
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error === '1') {
                const errorMessageDiv = document.getElementById('errorMessage');
                errorMessageDiv.textContent = 'Login Failed. Please try again.';
            }
        });
    </script>
</body>
</html>
