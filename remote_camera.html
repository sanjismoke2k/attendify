<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Camera - Attendify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #e5e7eb; }
        /* Make video fill the screen */
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
        }
        .stats-panel {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }
        .error-banner {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: none;
        }
        .error-banner.show { display: block; }
    </style>
</head>
<body class="antialiased">
    <video id="localVideo" playsinline autoplay muted></video>

    <div class="overlay">
        <!-- Header -->
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-xl font-bold text-white shadow-sm">Remote Cam</h1>
                <div class="text-xs text-gray-300">Face Recognition Node</div>
            </div>
            <div class="flex flex-col items-end gap-2">
                <div id="statusIndicator" class="px-3 py-1 text-sm font-semibold rounded-full bg-yellow-500 text-yellow-900 flex items-center gap-2 shadow-lg">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                    <span>INIT</span>
                </div>
                <!-- Network Stats for debugging lag -->
                <div id="latencyStats" class="stats-panel hidden text-green-400">
                    Ping: <span id="pingVal">0</span>ms | FPS: <span id="fpsVal">0</span>
                </div>
            </div>
        </div>

        <!-- Error Banner -->
        <div id="errorBanner" class="error-banner text-red-200">
            <div class="flex items-center gap-2">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400 flex-shrink-0"></i>
                <div>
                    <div id="errorTitle" class="font-bold text-red-300">Connection Error</div>
                    <div id="errorMessage" class="text-xs mt-1">Could not reach the server.</div>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="w-full max-w-md mx-auto space-y-4">
            <!-- Server URL Display -->
            <div class="bg-gray-900/80 backdrop-blur-md rounded-xl p-4 border border-gray-700">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs text-gray-400 font-medium">SERVER</span>
                    <span id="serverStatus" class="text-xs text-gray-500">checking...</span>
                </div>
                <div class="text-sm text-blue-400 font-mono truncate" id="serverUrlDisplay">
                    <!-- Filled by JS -->
                </div>
            </div>

            <!-- Quality Settings Toggle -->
            <div class="bg-gray-900/80 backdrop-blur-md rounded-xl p-4 border border-gray-700">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-gray-400 font-medium">QUALITY SETTINGS</span>
                    <span id="resDisplay" class="text-xs text-blue-400 font-mono">480x360 @ 50%</span>
                </div>
                <!-- 
                   Slider Logic:
                   1: Very Fast (320x240) - Use this if network is terrible
                   2: Balanced (480x360) - Recommended
                   3: High Res (640x480) - Use only on WiFi
                -->
                <input type="range" id="qualitySlider" min="1" max="3" step="1" value="2" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-[10px] text-gray-500 mt-1">
                    <span>Fast</span>
                    <span>Balanced</span>
                    <span>High Res</span>
                </div>
            </div>

            <!-- Main Button -->
            <div class="text-center pb-4">
                <button id="streamButton" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-2xl flex items-center justify-center gap-3 transition-all shadow-xl text-lg disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="video" class="w-6 h-6"></i> 
                    <span id="buttonText">Start Stream</span>
                </button>
            </div>
        </div>
    </div>

<script>
    const localVideo = document.getElementById('localVideo');
    const streamButton = document.getElementById('streamButton');
    const buttonText = document.getElementById('buttonText');
    const statusIndicator = document.getElementById('statusIndicator');
    const latencyStats = document.getElementById('latencyStats');
    const pingVal = document.getElementById('pingVal');
    const fpsVal = document.getElementById('fpsVal');
    const qualitySlider = document.getElementById('qualitySlider');
    const resDisplay = document.getElementById('resDisplay');
    const serverUrlDisplay = document.getElementById('serverUrlDisplay');
    const serverStatus = document.getElementById('serverStatus');
    const errorBanner = document.getElementById('errorBanner');
    const errorTitle = document.getElementById('errorTitle');
    const errorMessage = document.getElementById('errorMessage');

    let localStream;
    let isStreaming = false;
    let isSending = false;
    let frameCount = 0;
    let fpsTimer = null;
    let consecutiveErrors = 0;
    const MAX_CONSECUTIVE_ERRORS = 10;

    // Auto-detect the server URL from the page origin
    const SERVER_URL = window.location.origin;
    const UPLOAD_URL = SERVER_URL + '/upload_frame';

    // Configuration presets
    const presets = {
        1: { width: 320, height: 240, quality: 0.4, label: '320x240 @ 40%' },
        2: { width: 480, height: 360, quality: 0.5, label: '480x360 @ 50%' },
        3: { width: 640, height: 480, quality: 0.7, label: '640x480 @ 70%' }
    };
    
    let currentConfig = presets[2]; // Default to Balanced

    // Target frame rate (frames per second) - higher = smoother but more bandwidth
    const TARGET_FPS = 6;
    const FRAME_INTERVAL = 1000 / TARGET_FPS; // ms between frames
    let lastFrameTime = 0;

    // Display the server URL
    serverUrlDisplay.textContent = SERVER_URL;

    // Update config when slider changes
    qualitySlider.addEventListener('input', (e) => {
        currentConfig = presets[e.target.value];
        resDisplay.textContent = currentConfig.label;
    });

    // Check server connectivity on load
    async function checkServer() {
        try {
            const res = await fetch(SERVER_URL + '/api/server_info', { 
                method: 'GET',
                signal: AbortSignal.timeout(5000)
            });
            const data = await res.json();
            if (data.success) {
                serverStatus.textContent = data.camera_running ? '🟢 Camera Active' : '🟡 Connected';
                serverStatus.className = 'text-xs ' + (data.camera_running ? 'text-green-400' : 'text-yellow-400');
                hideError();
                return true;
            }
        } catch (e) {
            serverStatus.textContent = '🔴 Unreachable';
            serverStatus.className = 'text-xs text-red-400';
            showError(
                'Server Unreachable',
                'Cannot connect to ' + SERVER_URL + '. Make sure the server is running and the camera session has been started from the admin panel.'
            );
            return false;
        }
    }

    function showError(title, message) {
        errorTitle.textContent = title;
        errorMessage.textContent = message;
        errorBanner.classList.add('show');
    }

    function hideError() {
        errorBanner.classList.remove('show');
    }

    async function setupCamera() {
        try {
            const constraints = { 
                video: { 
                    facingMode: "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };
            
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            localVideo.srcObject = localStream;
            
            localVideo.onloadedmetadata = () => {
                streamButton.disabled = false;
                updateStatus('READY', 'bg-gray-500', 'text-gray-900', 'wifi-off');
            };
        } catch (e) {
            console.warn("Primary camera failed, trying fallback...", e);
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true });
                localVideo.srcObject = localStream;
                streamButton.disabled = false;
                updateStatus('READY', 'bg-gray-500', 'text-gray-900', 'wifi-off');
            } catch (err) {
                console.error("Camera access failed:", err);
                updateStatus('NO CAMERA', 'bg-red-500', 'text-red-900', 'video-off');
                buttonText.textContent = "Camera Error";
                showError(
                    'Camera Access Denied',
                    'Please allow camera access in your browser settings. On iOS, go to Settings > Safari > Camera.'
                );
            }
        }
    }

    // Creating the canvas once to save memory
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d', { alpha: false });

    async function sendFrame() {
        if (!isStreaming) return;
        
        // --- FRAME RATE THROTTLE ---
        const now = Date.now();
        const elapsed = now - lastFrameTime;
        if (elapsed < FRAME_INTERVAL) {
            requestAnimationFrame(sendFrame);
            return;
        }

        // --- PREVENT LAG ---
        // If we are currently sending a frame, we simply wait.
        if (isSending) {
            requestAnimationFrame(sendFrame);
            return;
        }

        isSending = true;
        lastFrameTime = now;
        const startTime = now;

        try {
            // Apply current resolution settings
            if (canvas.width !== currentConfig.width) {
                canvas.width = currentConfig.width;
                canvas.height = currentConfig.height;
            }

            // Draw video frame to canvas
            context.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
            
            // Compress
            const dataURL = canvas.toDataURL('image/jpeg', currentConfig.quality);
            
            // Send to server
            const response = await fetch(UPLOAD_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataURL }),
                signal: AbortSignal.timeout(10000) // 10s timeout
            });
            
            const data = await response.json();
            
            // Update Ping Display
            const rtt = Date.now() - startTime;
            pingVal.textContent = rtt;
            pingVal.className = rtt > 500 ? 'text-red-400' : (rtt > 200 ? 'text-yellow-400' : 'text-green-400');
            
            // Track FPS
            frameCount++;

            // Reset error counter on success
            consecutiveErrors = 0;
            hideError();

            if (data.status !== 'received') {
                if (data.message && data.message.includes('not running')) {
                    stopStreaming();
                    showError(
                        'Camera Session Not Active',
                        'The server camera is not running. Start it from the Attendance Control page first.'
                    );
                }
            }
        } catch (err) {
            consecutiveErrors++;
            console.error("Frame drop:", err.message);
            
            // Flash status indicator red
            statusIndicator.classList.replace('bg-green-500', 'bg-red-500');
            setTimeout(() => {
                if(isStreaming) statusIndicator.classList.replace('bg-red-500', 'bg-green-500');
            }, 500);

            if (consecutiveErrors >= MAX_CONSECUTIVE_ERRORS) {
                stopStreaming();
                showError(
                    'Connection Lost',
                    `Failed to send ${MAX_CONSECUTIVE_ERRORS} consecutive frames. Check your network connection and server status.`
                );
            }
        } finally {
            isSending = false;
            // Continue the loop
            if (isStreaming) requestAnimationFrame(sendFrame);
        }
    }

    function startStreaming() {
        if (!localStream) return;
        isStreaming = true;
        consecutiveErrors = 0;
        frameCount = 0;
        lastFrameTime = 0;
        
        streamButton.classList.replace('bg-blue-600', 'bg-red-600');
        streamButton.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
        buttonText.textContent = "Stop Stream";
        updateStatus('LIVE', 'bg-green-500', 'text-green-900', 'wifi');
        latencyStats.classList.remove('hidden');
        hideError();
        
        // FPS counter
        fpsTimer = setInterval(() => {
            fpsVal.textContent = frameCount;
            frameCount = 0;
        }, 1000);

        // Kick off the loop
        sendFrame();
    }

    function stopStreaming() {
        isStreaming = false;
        isSending = false;
        if (fpsTimer) { clearInterval(fpsTimer); fpsTimer = null; }
        
        streamButton.classList.replace('bg-red-600', 'bg-blue-600');
        streamButton.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
        buttonText.textContent = "Start Stream";
        updateStatus('READY', 'bg-gray-500', 'text-gray-900', 'wifi-off');
        latencyStats.classList.add('hidden');
    }

    function toggleStreaming() {
        if (isStreaming) stopStreaming();
        else startStreaming();
    }
    
    function updateStatus(text, bgColor, textColor, icon) {
        statusIndicator.className = `px-3 py-1 text-sm font-semibold rounded-full ${bgColor} ${textColor} flex items-center gap-2 shadow-lg transition-all duration-300`;
        statusIndicator.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${text}</span>`;
        lucide.createIcons();
    }

    streamButton.addEventListener('click', toggleStreaming);
    streamButton.disabled = true;

    lucide.createIcons();
    checkServer();
    setupCamera();
</script>
</body>
</html>
