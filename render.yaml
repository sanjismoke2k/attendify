services:
  - type: web
    name: attendify
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SUPER_ADMIN_PASSWORD
        value: admin123
      - key: PYTHON_VERSION
        value: 3.11.7
    healthCheckPath: /health
